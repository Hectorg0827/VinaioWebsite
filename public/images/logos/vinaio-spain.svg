<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400&amp;display=swap');
      .text { font-family: 'Cinzel', serif; fill: #8B1C31; text-anchor: middle; }
      .vinaio { font-size: 110px; letter-spacing: 20px; font-weight: 400; }
      .spain { font-size: 55px; letter-spacing: 35px; font-weight: 400; }
      .line { stroke: #8B1C31; stroke-width: 3; }
    </style>
    <!-- Mask to hide the crossbar of the A to match the exact VINAIO brand mark -->
    <mask id="crossbar-mask">
      <rect width="600" height="200" fill="white" />
      <!-- Cut out the crossbar area roughly where the A is -->
      <rect x="290" y="70" width="40" height="15" fill="black" />
    </mask>
  </defs>
  
  <g mask="url(#crossbar-mask)">
    <!-- Using standard A but masking the crossbar to create the Lambda effect -->
    <text x="315" y="105" class="text vinaio">VINAIO</text>
  </g>
  <line x1="140" y1="130" x2="475" y2="130" class="line" />
  <text x="325" y="185" class="text spain">SPAIN</text>
</svg>
